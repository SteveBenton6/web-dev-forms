<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles/styles.css" />
    <title>Forms</title>
  </head>
  <body>
    <!-- html comments -->
    <h1>This is A Form</h1>
    <form action="/" method="GET">
      <label for="username">Enter Your Name:</label>
      <input type="text" name="user-name" id="username" />

      <label for="usermessage">Your Message:</label>
      <textarea id="usermessage" name="user-message"></textarea>

      <label for="useremail">Enter Your email:</label>
      <input type="email" name="user-email" id="useremail" />
      <label for="userage">Enter Your Age:</label>
      <input type="number" step="1" name="user-age" id="userage" />
      <label for="userpassword">Enter Your Password:</label>
      <input type="password" name="user-password" id="userpassword" />
      <label for="userbirthday">Enter Your Birthday:</label>
      <input type="date" name="user-birthday" id="userbirthday" />
      <hr />
      <label for="favouritecolor">Your Favourite Colour:</label>
      <select id="favouritecolor" name="favourite-color">
        <option value="red">Red</option>
        <option>Orange</option>
        <option>Yellow</option>
        <option>Green</option>
      </select>

      <h2>How should we verify your account?</h2>
      <div class="form-control-buttons">
        <input
          type="radio"
          name="verify-method"
          id="verify-text-message"
          value="text-message"
        />
        <label for="verify-text-message">Via text message (SMS):</label>
      </div>
      <div class="form-control-buttons">
        <input
          type="radio"
          name="verify-method"
          id="verify-phone"
          value="phone"
        />
        <label for="verify-phone">Via a phone call:</label>
      </div>
      <div class="form-control-buttons">
        <input
          type="radio"
          name="verify-method"
          id="verify-email"
          value="email"
        />
        <label for="verify-email">Via an email:</label>
      </div>
      <div class="form-control-buttons">
        <input type="checkbox" name="terms" id="agree-terms" />
        <label for="agree-terms">Agree to terms?</label>
      </div>

      <hr />
      <div class="form-control-buttons">
        <input
          type="checkbox"
          name="contact"
          id="contact-email"
          value="email"
        />
        <label for="contact-email">Contact me via email</label>
      </div>
      <div class="form-control-buttons">
        <input type="checkbox" name="contact" id="contact-text" value="text" />
        <label for="contact-text">Contact me via text</label>
      </div>
      <div class="form-control-buttons">
        <input
          type="checkbox"
          name="contact"
          id="contact-phone"
          value="phone"
        />
        <label for="contact-phone">Contact me via phone</label>
      </div>
      <button>Submit</button>
    </form>
    <script src="./app.js"></script>
  </body>
</html>

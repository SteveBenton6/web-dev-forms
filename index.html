<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles/styles.css" />
    <title>Forms</title>
  </head>
  <body>
    <!-- html comments -->
    <header><h1>This is My Form</h1></header>
    <main>
      <form action="/" method="GET">
        <section>
          <h2>Your Personal Details:</h2>
          <ul>
            <li>
              <label for="username">Enter Your Name:</label>
              <input type="text" name="user-name" id="username" required placeholder="Firstname Lastname"/>
            </li>
            <li>
              <label for="useremail">Enter Your email:</label>
              <input type="email" name="user-email" id="useremail" required/>
            </li>
            <li>
              <label for="userpassword">Enter Your Password:</label>
              <input type="password" name="user-password" id="userpassword" required minlength="8"/>
            </li>
          </ul>
        </section>

        <hr>

        <section>
          <h2>More Personal Details:</h2>
          <ul>
            <li>
              <label for="userage">Enter Your Age:</label>
              <input type="number" step="1" name="user-age" id="userage" required min="18"/>
            </li>
            <li>
              <label for="userbirthday">Enter Your Birthday:</label>
              <input type="date" name="user-birthday" id="userbirthday" min="1925-01-01" max="2016-07-31"/>
            </li>
            <li>
              <label for="favouritecolor">Your Favourite Colour:</label>
              <select id="favouritecolor" name="favourite-color">
                <option value="red">Red</option>
                <option>Orange</option>
                <option>Yellow</option>
                <option>Green</option>
              </select>
            </li>
          </ul>
        </section>
        <section>
          <label for="usermessage">Your Message:</label>
          <textarea id="usermessage" name="user-message" rows="5"></textarea>
        </section>

        <hr />

        <section>
          <h2>How should we verify your account?</h2>
          <h4>Please Select One</h4>
          <ul>
            <li class="form-control-buttons">
              <input
                type="radio"
                name="verify-method"
                id="verify-text-message"
                value="text-message"
              />
              <label for="verify-text-message">- Via text message (SMS)</label>
            </li>
            <li class="form-control-buttons">
              <input
                type="radio"
                name="verify-method"
                id="verify-phone"
                value="phone"
              />
              <label for="verify-phone">- Via a phone call</label>
            </li>
            <li class="form-control-buttons">
              <input
                type="radio"
                name="verify-method"
                id="verify-email"
                value="email"
              />
              <label for="verify-email">- Via an email</label>
            </li>
            
          </ul>
        </section>

        <hr />

        <section>
          <h2>How should we contact You?</h2>
          <h4>Please click all that apply.</h4>
          <ul>
            <li class="form-control-buttons">
              <input
                type="checkbox"
                name="contact"
                id="contact-email"
                value="email"
              />
              <label for="contact-email">Contact me via email</label>
            </li>
            <li class="form-control-buttons">
              <input
                type="checkbox"
                name="contact"
                id="contact-text"
                value="text"
              />
              <label for="contact-text">Contact me via text</label>
            </li>
            <li class="form-control-buttons">
              <input
                type="checkbox"
                name="contact"
                id="contact-phone"
                value="phone"
              />
              <label for="contact-phone">Contact me via phone</label>
            </li>
          </ul>
        </section>

        <hr>

        <section>
          <div class="form-control-buttons">
              <input type="checkbox" name="terms" id="agree-terms" />
              <label for="agree-terms">Agree to terms?</label>
          </div>
        </section>

        <section>
          <button>Submit</button>
        </section>

        <section>
          <button type="reset" class="reset-button">Reset Form</button>
        </section>

      </form>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
</section>
